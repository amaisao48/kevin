<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liberty Cockpit HOME (sample data)</title>
<style>
html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden}
.win{position:absolute;inset:0}
.bar{position:absolute;left:0;right:0;top:0;height:44px;box-sizing:border-box;display:flex;align-items:center;background:linear-gradient(#283033,#141C20);border-bottom:1px solid #82939B42;font:11px/1 Consolas,"Cascadia Mono","JetBrains Mono",monospace;color:#E5E8E6;white-space:nowrap}
.cap{flex:1;padding-left:21px;color:#9DABB0;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;align-items:center;gap:8px;margin-right:15px}
.chk i{width:13px;height:13px;background:#DDBA72;position:relative}
.chk i:after{content:'';position:absolute;left:4px;top:1px;width:3px;height:7px;border:solid #11191C;border-width:0 2px 2px 0;transform:rotate(45deg)}
.btn{box-sizing:border-box;height:34px;display:flex;align-items:center;padding:6px 14px;border:1px solid #82939B55;background:#202D32;color:#E5E8E6;margin-right:15px}
.go{background:#DDBA72;color:#11191C;border:1px solid #EDC16A;outline:2px solid #EDC16A;outline-offset:2px;margin-right:14px;transition:filter .08s,transform .08s}
.go.press{filter:brightness(.86);transform:translateY(1px)}
.wb{display:flex;height:44px}.wb span{width:43px;display:grid;place-items:center;color:#C9D2D4;font-size:13px}
.dash{position:absolute;left:0;top:44px;width:100%;height:calc(100% - 44px);border:0;display:block;background:#0A0A0A}
.cur{position:absolute;left:0;top:0;width:22px;height:30px;pointer-events:none;opacity:0;z-index:5;will-change:transform}
/* narrow window: the same bar, the parts that fit */
@media (max-width:760px){.cap,.chk,.btn.retry{display:none}.bar{justify-content:flex-end;padding-left:14px}.bar:before{content:'Business overview';flex:1;color:#9DABB0;letter-spacing:.06em}}
</style></head>
<body><div class="win">
<div class="bar"><span class="cap">Business overview</span><span class="chk"><i></i>Start here</span><span class="btn retry">Retry</span><span class="btn go" id="go">Go to chat &rarr;</span><span class="wb"><span><i style="display:block;width:10px;height:1px;background:currentColor"></i></span><span>&#x25A1;</span><span>&#x2715;</span></span></div>
<iframe class="dash" id="dash" src="dash.html" title="Liberty Cockpit HOME dashboard, sample data" loading="eager"></iframe>
<svg class="cur" id="cur" viewBox="0 0 22 30" aria-hidden="true"><path d="M2 2v22l6-5.5 4 9 4-1.8-4-8.8h8z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
(function(){
  var go=document.getElementById('go'),cur=document.getElementById('cur'),dash=document.getElementById('dash'),Q=new URLSearchParams(location.search);
  function send(m){try{dash.contentWindow.postMessage(m,'*')}catch(e){}}
  function cursor(p){if(p<0){cur.style.opacity=0;go.classList.remove('press');return}
    var r=go.getBoundingClientRect(),W=innerWidth,Hh=innerHeight,x1=r.left+r.width*.55,y1=r.top+r.height*.6,x0=x1-W*.13,y0=y1+Hh*.2,
      e=Math.min(1,p/.8),k=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2,x=x0+(x1-x0)*k,y=y0+(y1-y0)*k;
    cur.style.opacity=Math.min(1,p*6);cur.style.transform='translate('+x+'px,'+y+'px)';go.classList.toggle('press',p>=.86)}
  addEventListener('message',function(e){var m=e.data||{};if(m.kv==='cursor')cursor(m.p);else if(m.kv)send(m)});
  window.__kvhome={cursor:cursor,send:send};
  if(Q.has('demo')){   // the clip's sequence: idle, the payment lands, the cursor walks over and clicks
    dash.addEventListener('load',function(){send({kv:'arrive'});setTimeout(function(){send({kv:'pay'})},5000)});
    var t0=performance.now();(function f(){var t=(performance.now()-t0)/1000;if(t>9.5&&t<11.6)cursor((t-9.5)/1.6);
      if(t>=11.6){document.querySelector('.win').style.visibility='hidden';return}requestAnimationFrame(f)})();
  }
  window.__done=true;
})();
</script></body></html>
